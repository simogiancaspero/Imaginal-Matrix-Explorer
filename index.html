function initSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML = '<div class="sb-lbl" id="t-params">'+STR[currentLang].params+'</div>';
  PM.forEach(function(pm,pi){
    var pb=document.createElement('div');pb.className='pb';
    var ph=document.createElement('div');ph.className='ph';
    var pn=document.createElement('span');pn.className='pn';pn.textContent=pm[currentLang];
    var tw=document.createElement('div');tw.className='tip-w';
    var ti=document.createElement('span');ti.className='tip-i';ti.textContent='i';
    var tb=document.createElement('div');tb.className='tip-b';tb.textContent=pm['tip_'+currentLang];
    tw.appendChild(ti);tw.appendChild(tb);
    var sv=document.createElement('span');sv.className='sv';sv.id='sv-'+pm.k;sv.textContent=(VL[pm.k]).toFixed(1);
    ph.appendChild(pn);ph.appendChild(tw);ph.appendChild(sv);
    var sl=document.createElement('input');
    sl.type='range';sl.className='sl';sl.id='sl-'+pm.k;
    sl.min=0;sl.max=10;sl.step=1;sl.value=VL[pm.k]*10;sl.dataset.k=pm.k;sl.disabled=(mode==='manual');
    pb.appendChild(ph);pb.appendChild(sl);
    sb.appendChild(pb);
    if(pi<PM.length-1){var dv=document.createElement('div');dv.className='dv';sb.appendChild(dv);}
    
    sl.addEventListener('input',function(){
      updSlider(sl);
      if(mode==='auto') render();
    });
    updSliderColor(sl, sl.value);
  });
  var cntEl=document.createElement('div');
  cntEl.className='cnt-b';
  cntEl.innerHTML='<div class="cnt-n" id="cnt">32 / 32</div><div class="cnt-l" id="t-configs">'+STR[currentLang].configs+'</div>';
  sb.appendChild(cntEl);
}

function updSlider(sl){
  var k=sl.dataset.k,v=parseInt(sl.value);
  VL[k]=v/10;
  var sv=document.getElementById('sv-'+k);
  if(sv)sv.textContent=(v/10).toFixed(1);
  updSliderColor(sl, v);
}
function updSliderColor(sl, v) {
  sl.style.background='linear-gradient(to right,#7C3AED '+(v*10)+'%,rgba(255,255,255,0.07) '+(v*10)+'%)';
}

function eucl(s){
  var de=s.e-VL.e,dr=s.r-VL.r,dd=s.d-VL.d,di=s.i-VL.i,dp=s.p-VL.p;
  return Math.sqrt(de*de+dr*dr+dd*dd+di*di+dp*dp);
}

function autoDistance(s){
  return eucl(s);
}

function gi(s, lk) {
  var textKey = lk + '_' + currentLang;
  var text = s[textKey];

  if (!text || text.trim() === "") {
    text = s[lk + '_' + (currentLang === 'it' ? 'en' : 'it')] || "Dati in fase di inserimento per questa configurazione.";
  }

  return '<strong style="font-size:11px;color:rgba(241,240,255,0.65);display:block;margin-bottom:6px;">' + LN[currentLang][lk] + '</strong><p style="margin-bottom:10px;">' + text + '</p>';
}

function exHtml(s) {
  var exArr = s['ex_' + currentLang] || s['ex_' + (currentLang === 'it' ? 'en' : 'it')] || [];
  if (exArr.length === 0) return '';
  var html = '<div class="ex-list"><div class="ex-title">' + STR[currentLang].ex + '</div><ul>';
  exArr.forEach(function(ex) {
    html += '<li>' + ex + '</li>';
  });
  html += '</ul></div>';
  return html;
}

function mkCard(s,si,d){
  var div=document.createElement('div');div.className='card';
  var crow=document.createElement('div');crow.className='crow';
  var nm=document.createElement('span');nm.className='cname';nm.textContent=s['n_'+currentLang];crow.appendChild(nm);
  if(mode==='auto'){var db=document.createElement('span');db.className='dbadge';db.textContent='\u03b4 '+d.toFixed(2);crow.appendChild(db);}
  var pd=document.createElement('div');pd.className='pills';
  ['e','r','d','i','p'].forEach(function(k){var sp=document.createElement('span');sp.className='pill '+(s[k]===1?'p1':'p0');sp.textContent=PM.find(p=>p.k===k)[currentLang].substring(0,3).toUpperCase()+' '+s[k];pd.appendChild(sp);});
  var desc=document.createElement('div');desc.className='cdesc';desc.textContent=s['desc_'+currentLang];
  var exp=document.createElement('div');exp.className='exp';
  var bip=document.createElement('div');bip.className='bip';
  bip.innerHTML='<div class="bip-desc">'+STR[currentLang].oscilla+'</div><div class="bip-poles"><div><div class="bpl">'+STR[currentLang].pos+'</div><div class="bpv bpp">+ '+s['pos_'+currentLang]+'</div></div><div style="font-size:18px;color:rgba(255,255,255,0.07)">&middot;</div><div style="text-align:right"><div class="bpl">'+STR[currentLang].neg+'</div><div class="bpv bpn">&#8722; '+s['neg_'+currentLang]+'</div></div></div>';
  var ltl=document.createElement('div');ltl.className='lt-lbl';ltl.textContent=STR[currentLang].guide;
  var tabs=document.createElement('div');tabs.className='tabs';
  LK.forEach(function(lk,li){var btn=document.createElement('button');btn.className='tab'+(li===0?' on':'');btn.dataset.lk=lk;btn.textContent=LN[currentLang][lk];tabs.appendChild(btn);});
  var lcId='lc-'+si+'-'+Math.random().toString(36).slice(2);
  var lc=document.createElement('div');lc.className='lc on';lc.id=lcId;lc.innerHTML=gi(s,LK[0]);
  var exWrap=document.createElement('div');exWrap.className='ex-wrap';exWrap.innerHTML=exHtml(s);
  exp.appendChild(bip);exp.appendChild(ltl);exp.appendChild(tabs);exp.appendChild(lc);exp.appendChild(exWrap);
  div.appendChild(crow);div.appendChild(pd);div.appendChild(desc);div.appendChild(exp);
  div.addEventListener('click',function(ev){
    var tb=ev.target.closest('.tab');
    if(tb){ev.stopPropagation();
      tabs.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
      tb.classList.add('on');
      lc.classList.add('on');
      lc.innerHTML=gi(s,tb.dataset.lk);
      return;
    }
    div.classList.toggle('open');
  });
  return div;
}

// Mobile hamburger toggle for sidebar
document.addEventListener('DOMContentLoaded', function(){
  var btnHamb = document.getElementById('btn-hamb');
  var sb = document.getElementById('sb');
  var backdrop = document.getElementById('sb-backdrop');
  if(!btnHamb || !sb || !backdrop) return;
  btnHamb.addEventListener('click', function(){
    var open = sb.classList.toggle('open');
    backdrop.style.display = open ? 'block' : 'none';
    btnHamb.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) document.body.style.overflow='hidden'; else document.body.style.overflow='';
  });
  backdrop.addEventListener('click', function(){
    sb.classList.remove('open');
    backdrop.style.display='none';
    btnHamb.setAttribute('aria-expanded','false');
    document.body.style.overflow='';
  });
  // Close sidebar when resizing to larger screens
  window.addEventListener('resize', function(){
    if(window.innerWidth>800){
      sb.classList.remove('open');
      backdrop.style.display='none';
      btnHamb.setAttribute('aria-expanded','false');
      document.body.style.overflow='';
    }
  });
});

function render(){
  var items=STATES.map(function(s,si){return{s:s,si:si,d:autoDistance(s)};});

  if(mode==='manual'){
    items.sort(function(a,b){
      var an=(a.s['n_'+currentLang] || '').toLowerCase();
      var bn=(b.s['n_'+currentLang] || '').toLowerCase();
      return an.localeCompare(bn);
    });
  } else {
    items.sort(function(a,b){return a.d-b.d;});
    items = items.filter(function(i){ return i.d <= 1.0; });
  }

  var m=document.getElementById('main');m.innerHTML='';
  var frag=document.createDocumentFragment();
  items.forEach(function(item){frag.appendChild(mkCard(item.s,item.si,item.d));});
  m.appendChild(frag);
  
  var cnt = document.getElementById('cnt');
  if(cnt) cnt.textContent = items.length + " / 32";
}

function setMode(m){
  mode=m;
  var bm=document.getElementById('btn-man'),ba=document.getElementById('btn-auto'),tn=document.getElementById('tnote');
  if(m==='manual'){
    bm.classList.add('on');ba.classList.remove('on');
    tn.textContent=STR[currentLang].all;
    document.querySelectorAll('.sl').forEach(function(sl){sl.disabled=true;});
  } else {
    ba.classList.add('on');bm.classList.remove('on');
    tn.textContent=STR[currentLang].filtered;
    document.querySelectorAll('.sl').forEach(function(sl){sl.disabled=false;});
  }
  render();
}

function updateLangTexts(){
  document.getElementById('btn-man').textContent = STR[currentLang].man;
  document.getElementById('btn-auto').textContent = STR[currentLang].auto;
  document.getElementById('t-subtitle').innerHTML = STR[currentLang].sub;
  document.getElementById('tnote').textContent = mode==='manual' ? STR[currentLang].all : STR[currentLang].filtered;
  initSidebar(); 
  render();
}

document.getElementById('btn-man').addEventListener('click',function(){setMode('manual');});
document.getElementById('btn-auto').addEventListener('click',function(){setMode('auto');});

document.getElementById('lang-it').addEventListener('click', function(){
  currentLang = 'it';
  this.classList.add('active'); document.getElementById('lang-en').classList.remove('active');
  updateLangTexts();
});
document.getElementById('lang-en').addEventListener('click', function(){
  currentLang = 'en';
  this.classList.add('active'); document.getElementById('lang-it').classList.remove('active');
  updateLangTexts();
});

initSidebar();
render();
})();
</script>
