<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imaginal Matrix Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#07000f;color:#F1F0FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);}
.o1{width:600px;height:600px;background:radial-gradient(circle,rgba(110,60,210,0.35) 0%,transparent 70%);top:-200px;left:-150px;animation:fa 30s ease-in-out infinite;}
.o2{width:500px;height:500px;background:radial-gradient(circle,rgba(75,30,170,0.25) 0%,transparent 70%);bottom:-150px;right:-120px;animation:fb 38s ease-in-out infinite;}
.o3{width:400px;height:400px;background:radial-gradient(circle,rgba(150,80,255,0.15) 0%,transparent 70%);top:42%;left:42%;animation:fc 24s ease-in-out infinite;}
@keyframes fa{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,-40px);}}
@keyframes fb{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,40px);}}
@keyframes fc{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-35px,25px) scale(1.15);}}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.hdr{flex-shrink:0;padding:.9rem 1.8rem;border-bottom:.5px solid rgba(255,255,255,0.07);backdrop-filter:blur(20px);background:rgba(7,0,15,0.75);position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.hdr-t{font-size:18px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(130deg,#FFFBFF,#C4B5FD 50%,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .hdr-s{font-size:10.5px;color:rgba(241,240,255,0.88);margin-top:3px;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.flags{position:static;display:flex;gap:10px;font-size:20px;align-items:center;margin-left:6px}
.flag{cursor:pointer;opacity:0.3;transition:all .2s;filter:grayscale(80%);}
.flag:hover{opacity:0.7;}
.flag.active{opacity:1;filter:grayscale(0%);transform:scale(1.1);}
.toolbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:.6rem 1.8rem;border-bottom:.5px solid rgba(255,255,255,0.06);background:rgba(7,0,15,0.55);backdrop-filter:blur(20px);}
  .mbtn{font-size:12px;font-weight:600;padding:6px 15px;border-radius:9px;border:.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(241,240,255,0.88);cursor:pointer;transition:all .18s;}
  .mbtn:hover{background:rgba(255,255,255,0.05);color:rgba(241,240,255,0.95);}
.mbtn.on{background:rgba(139,92,246,0.22);border-color:rgba(139,92,246,0.5);color:#C4B5FD;}
  .tnote{font-size:10.5px;color:rgba(241,240,255,0.88);margin-left:auto;}
/* hide hamburger on large screens; show only on small */
#btn-hamb{display:none}
.wrap{flex:1;display:flex;overflow:hidden;}
.sb{width:250px;flex-shrink:0;border-right:.5px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.01);padding:1.1rem 1.1rem;display:flex;flex-direction:column;gap:0;overflow-y:auto;}
.sb::-webkit-scrollbar{width:3px;}
.sb::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.3);border-radius:2px;}
  .sb-lbl{font-size:9px;font-weight:700;color:rgba(241,240,255,0.88);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.9rem;}
.pb{padding-bottom:.85rem;}
.ph{display:flex;align-items:center;gap:5px;margin-bottom:7px;}
  .pn{font-size:12px;font-weight:600;color:rgba(241,240,255,0.95);}
.sv{font-size:12px;font-weight:700;color:#C4B5FD;margin-left:auto;}
.tip-w{position:relative;display:inline-flex;}
.tip-i{width:14px;height:14px;border-radius:50%;background:rgba(139,92,246,0.18);border:.5px solid rgba(139,92,246,0.38);color:#9980E8;font-size:8.5px;font-style:italic;font-weight:800;display:inline-flex;align-items:center;justify-content:center;cursor:default;user-select:none;flex-shrink:0;}
  .tip-b{display:none;position:absolute;left:18px;top:-4px;width:185px;background:rgba(10,3,28,0.98);border:.5px solid rgba(139,92,246,0.28);border-radius:9px;padding:8px 10px;font-size:11px;color:rgba(241,240,255,0.92);line-height:1.55;z-index:400;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.85);} 
.tip-w:hover .tip-b{display:block;}
input.sl{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;outline:none;cursor:pointer;background:#1a0a30;transition:opacity .2s;}
input.sl:disabled{opacity:.25;cursor:not-allowed;}
input.sl::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#A78BFA;border:2.5px solid #07000f;box-shadow:0 0 0 2px rgba(139,92,246,0.35);cursor:pointer;}
input.sl:disabled::-webkit-slider-thumb{cursor:not-allowed;}
input.sl::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#A78BFA;border:2.5px solid #07000f;}
.dv{height:.5px;background:rgba(255,255,255,0.05);margin-bottom:.85rem;}
.cnt-b{margin-top:auto;padding-top:.9rem;border-top:.5px solid rgba(255,255,255,0.05);}
.cnt-n{font-size:30px;font-weight:800;background:linear-gradient(135deg,#F1F0FF,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .cnt-l{font-size:10.5px;color:rgba(241,240,255,0.88);margin-top:2px;}
.main{flex:1;padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-width:0;}
.main::-webkit-scrollbar{width:3px;}
.main::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.2);border-radius:2px;}
.card{background:rgba(255,255,255,0.023);border:.5px solid rgba(255,255,255,0.07);border-radius:16px;padding:1rem 1.25rem;cursor:pointer;transition:all .18s;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.card:hover{background:rgba(255,255,255,0.038);border-color:rgba(139,92,246,0.26);transform:translateY(-1px);box-shadow:0 6px 22px rgba(70,20,160,0.16);}
.card.open{border-color:rgba(139,92,246,0.44);box-shadow:0 0 0 1px rgba(139,92,246,0.12),0 8px 28px rgba(70,20,160,0.22);}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.cname{font-size:15px;font-weight:700;color:#F1F0FF;letter-spacing:-.015em;}
.dbadge{font-size:10px;padding:2px 7px;border-radius:11px;background:rgba(139,92,246,0.13);border:.5px solid rgba(139,92,246,0.25);color:#9880DE;font-weight:600;}
.pills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;}
.pill{font-size:10px;padding:2px 7px;border-radius:18px;font-weight:600;}
  .p0{background:rgba(255,255,255,0.05);color:rgba(241,240,255,0.28);border:.5px solid rgba(255,255,255,0.06);}
.p1{background:rgba(139,92,246,0.17);color:#C4B5FD;border:.5px solid rgba(139,92,246,0.28);}
  .cdesc{font-size:12px;color:rgba(241,240,255,0.9);line-height:1.7;}
.exp{margin-top:12px;padding-top:12px;border-top:.5px solid rgba(255,255,255,0.06);display:none;}
.card.open .exp{display:block;}
.bip{display:flex;flex-direction:column;padding:9px 13px;background:rgba(255,255,255,0.015);border-radius:10px;border:.5px solid rgba(255,255,255,0.06);margin-bottom:12px;}
.bip-desc{font-size:11px;color:#FFFFFF;margin-bottom:8px;text-align:center;font-style:italic;}
.bip-poles{display:flex;justify-content:center;align-items:center;gap:16px;max-width:420px;width:100%;margin:0 auto;flex-wrap:nowrap;}
.bip-poles > div{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;flex:1 1 0;}
.bip-poles > div:last-child{align-items:flex-end;}
.bip-poles > div:first-child{align-items:flex-start;}
.bpl{font-size:9.5px;color:#FFFFFF;margin-bottom:2px;}
.bpv{font-size:12.5px;font-weight:700;}
.bpp{color:#34D399;}
.bpn{color:#F87171;}
.lt-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#FFFFFF;margin-bottom:7px;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end;padding:0 2px 0;margin-bottom:0;}
  .tab{font-size:10px;padding:6px 10px 7px;border-radius:10px 10px 0 0;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-bottom:none;color:rgba(241,240,255,0.9);cursor:pointer;transition:all .14s;font-weight:500;position:relative;top:1px;}
  .tab:hover{background:rgba(255,255,255,0.04);color:rgba(241,240,255,0.94);}
.tab.on{background:rgba(139,92,246,0.22);border-color:rgba(139,92,246,0.42);color:#C4B5FD;font-weight:600;box-shadow:0 -1px 0 rgba(139,92,246,0.3);z-index:2;}
  .lc{background:rgba(255,255,255,0.012);border:1px solid rgba(255,255,255,0.06);border-radius:0 10px 10px 10px;padding:.75rem .95rem;font-size:12px;color:rgba(241,240,255,0.92);line-height:1.82;margin-top:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);transition:all .14s;}
.lc.on{background:rgba(139,92,246,0.18);border-color:rgba(139,92,246,0.42);color:#F1F0FF;box-shadow:0 0 0 1px rgba(139,92,246,0.1), inset 0 1px 0 rgba(255,255,255,0.08);}
.ex-list{margin-top:10px;padding:10px 0 0;border-top:1px dashed rgba(255,255,255,0.1);}
.ex-title{font-size:10px;font-weight:700;text-transform:uppercase;color:rgba(139,92,246,0.8);margin-bottom:6px;}
.ex-list ul{padding-left:15px;list-style-type:circle;}
  .ex-list li{font-size:11px;margin-bottom:4px;color:rgba(241,240,255,0.92);}
  footer{flex-shrink:0;border-top:.5px solid rgba(255,255,255,0.06);background:rgba(7,0,15,0.8);padding:.7rem 1.8rem;text-align:center;font-size:10.5px;color:rgba(241,240,255,0.88);}
footer span{color:rgba(139,92,246,0.55);}
  </style>
  <style>
  /* Responsive tweaks for small screens */
  @media (max-width: 800px) {
    .app{height:auto;min-height:100vh;}
    .wrap{flex-direction:column;}
    /* hide sidebar by default on small screens; will open as overlay */
    .sb{display:none;width:100%;flex-shrink:0;border-right:none;border-bottom:.5px solid rgba(255,255,255,0.06);max-height:38vh;overflow:auto;padding:.9rem;}
    /* hamburger visible on small screens */
    #btn-hamb{display:inline-flex;margin-left:6px}
    /* overlay sidebar when opened */
    .sb.open{display:flex;position:fixed;left:0;top:0;bottom:0;width:78%;max-width:420px;background:rgba(7,0,15,0.95);backdrop-filter:blur(10px);padding:1.1rem;flex-direction:column;z-index:60;overflow:auto;box-shadow:2px 0 24px rgba(0,0,0,0.6);}
    .sb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:55;display:none}
    /* ensure sidebar controls stack and sliders don't overlap labels */
    .pb{padding-bottom:.6rem;}
    .ph{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-bottom:10px;}
    .ph .pn{margin-bottom:4px;}
    .ph .sv{margin-left:0;align-self:flex-end;}
    input.sl{width:100%;margin-top:6px;}
    /* hide hover tooltips on touch devices to avoid overlap */
    .tip-b{display:none !important;}
    /* make sidebar above main content to avoid visual overlap */
    .sb{position:relative;z-index:3}
    .main{padding:.8rem;}
    .hdr,.toolbar,footer{padding-left:1rem;padding-right:1rem;}
    .flags{position:static;top:auto;right:auto;transform:none;margin-top:8px;display:flex;gap:8px;}
    .orb.o1,.orb.o2,.orb.o3{width:220px;height:220px;filter:blur(60px);} 
    .cnt-n{font-size:22px;}
    .cname{font-size:14px;}
    .card{padding:.8rem;border-radius:12px;}
    .bip-poles{flex-wrap:wrap;gap:8px;}
    input.sl{height:4px;}
    input.sl::-webkit-slider-thumb{width:18px;height:18px;}
    input.sl::-moz-range-thumb{width:18px;height:18px;}
    /* ensure page can scroll when content is long */
    .app, .main, .sb{overflow:visible;}
  }

  @media (max-width:420px){
    .hdr-t{font-size:16px;}
    .hdr-s{font-size:12px;}
    .sb-lbl{font-size:10px;}
    .pn{font-size:11px}
    .cnt-n{font-size:20px}
  }
  </style>
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="app">
  <header class="hdr">
    <div class="hdr-left">
      <div>
        <div class="hdr-t">Imaginal Matrix Explorer</div>
        <div class="hdr-s" id="t-subtitle">CTD Framework &bull; Esplora 32 configurazioni fenomenologiche e le implicazioni di design.</div>
      </div>
      <div class="flags">
        <span class="flag active" id="lang-it" title="Italiano">🇮🇹</span>
        <span class="flag" id="lang-en" title="English">🇬🇧</span>
      </div>
    </div>
    <button class="mbtn" id="btn-hamb" aria-label="Apri menu" aria-expanded="false">☰</button>
  </header>
  <div class="toolbar">
    <button class="mbtn on" id="btn-man">Ricerca manuale</button>
    <button class="mbtn" id="btn-auto">Ricerca automatica</button>
    <span class="tnote" id="tnote">Tutte le 32 configurazioni</span>
  </div>
  <div class="wrap">
    <aside class="sb" id="sb"><div class="sb-lbl" id="t-params">Parametri</div></aside>
    <main class="main" id="main"></main>
  </div>
  <div id="sb-backdrop" class="sb-backdrop" style="display:none"></div>
  <footer id="t-footer">CTD Framework &bull; <span>Imaginal Matrix Web Tool</span> &bull; V07_Beta Release &bull; Simone Giancaspero, 2026</footer>
</div>
<script>
(function(){
var mode='manual';
var currentLang = 'it';
var VL={e:0,r:0,d:0,i:0,p:0};

var STR = {
  it: {
    man: "Ricerca manuale", auto: "Ricerca automatica", all: "Tutte le 32 configurazioni",
    filtered: "Progressione euclidea", params: "Parametri", configs: "configurazioni",
    sub: "CTD Framework &bull; Esplora 32 configurazioni fenomenologiche e le implicazioni di design.",
    oscilla: "L'esperienza di questo stato oscilla tra:", pos: "percezione positiva", neg: "percezione negativa",
    guide: "Linee guida di design", ex: "Riferimenti reali per i tratti attivi nello stato:"
  },
  en: {
    man: "Manual search", auto: "Automatic search", all: "All 32 configurations",
    filtered: "Euclidean progression", params: "Parameters", configs: "configurations",
    sub: "CTD Framework &bull; Explore 32 phenomenological configurations and design implications.",
    oscilla: "The experience of this state oscillates between:", pos: "positive perception", neg: "negative perception",
    guide: "Design guidelines", ex: "Real-world references for the traits in this state:"
  }
};

var PM=[
  {k:'e',it:'Enfasi',en:'Emphasis',tip_it:'0 all\'inizio, 1 verso la fine.',tip_en:'0 at the beginning, 1 toward the end.'},
  {k:'r',it:'Ripetizione',en:'Repetition',tip_it:'0 evento singolo, 1 loop continuo.',tip_en:'0 single event, 1 continuous loop.'},
  {k:'d',it:'Direzione',en:'Direction',tip_it:'0 senza meta, 1 verso una conclusione.',tip_en:'0 without endpoint, 1 towards conclusion.'},
  {k:'i',it:'Intensità',en:'Intensity',tip_it:'0 nessuna, 1 estremamente forte.',tip_en:'0 none, 1 extremely forceful.'},
  {k:'p',it:'Regolarità',en:'Regularity',tip_it:'0 caotico, 1 completamente strutturato.',tip_en:'0 chaotic, 1 fully structured.'}
];

var LK=['V','Ic','S','C','Sp','T'];
var LN={
  it: {V:'Verbale',Ic:'Visivo/Iconico',S:'Sonoro/Musicale',C:'Cinestetico',Sp:'Spaziale',T:'Somatosensoriale'},
  en: {V:'Verbal',Ic:'Visual/Iconic',S:'Sound/Musical',C:'Kinesthetic',Sp:'Spatial',T:'Somatosensory'}
};

var STATES=[
{
    e:0,r:0,d:0,i:0,p:0,n_it:"Sospensione",n_en:"Suspension",
    desc_it:"Sensazione di galleggiamento o vuoto; la mente è in attesa pura, senza stimoli di rilievo.",
    desc_en:"Feeling of floating or emptiness; the mind is in pure waiting, without significant stimuli.",
    pos_it:"Attesa",pos_en:"Waiting",neg_it:"Vuoto",neg_en:"Emptiness",
    V_it: "Il testo deve aprirsi con una singola parola o una breve frase di innesco che cattura per un istante l'attenzione, per poi lasciarla sfumare immediatamente senza costruire uno sviluppo narrativo. Trattandosi di un evento unico, evita qualsiasi ritornello, anafora o ripetizione di concetti. La sintassi non deve seguire una griglia logica o grammaticale rigida, ma presentarsi slegata, fluida e leggermente caotica, quasi come un pensiero frammentario. Mantieni il registro su un'intensità bassissima, preferendo un tono di voce soffuso, un sussurro o un'esitazione. Soprattutto, il messaggio non deve contenere call to action, imperativi o direzioni di senso, lasciando il lettore in una pausa indeterminata e senza condurlo ad alcuna conclusione.",
    V_en: "The text should open with a single word or a brief trigger phrase that captures attention for a moment, then immediately lets it fade without building a narrative development. Being a unique event, avoid any refrain, anaphora, or repetition of concepts. The syntax should not follow a rigid logical or grammatical grid but appear loose, fluid, and slightly chaotic, almost like a fragmented thought. Keep the register at a very low intensity, preferring a hushed tone, whisper, or hesitation. Above all, the message should not contain calls to action, imperatives, or directions of meaning, leaving the reader in an indeterminate pause and without leading them to any conclusion.",
    Ic_it: "La progettazione visiva prevede un unico punto di innesco o un bagliore iniziale che perde subito definizione, dissolvendosi nello spazio circostante. Evita del tutto pattern, texture iterate o elementi seriali. La composizione deve rifiutare le griglie ortogonali, i layout geometrici e le simmetrie, disponendo gli elementi in modo organico, asimmetrico e caotico. I contrasti e la saturazione vanno ridotti al minimo, lavorando con luci diffuse, sfumature ed elementi desaturati. Non tracciare linee guida, vettori prospettici o punti di fuga che indirizzino lo sguardo verso un centro preciso, lasciando vagare l'occhio senza offrirgli un'ancora o una meta visiva.",
    Ic_en: "The visual design features a single trigger point or an initial glow that quickly loses definition, dissolving into the surrounding space. Avoid any patterns, iterative textures, or serial elements. The composition should reject orthogonal grids, geometric layouts, and symmetries, arranging elements in an organic, asymmetric, and chaotic manner. Contrasts and saturation should be minimized, working with diffuse lighting, gradients, and desaturated elements. Do not draw guidelines, perspective vectors, or vanishing points that direct the gaze toward a precise center, allowing the eye to wander without offering it an anchor or visual destination.",
    S_it: "Costruisci la dimensione acustica attorno a un singolo impulso sonoro iniziale che si estingue in un decadimento lunghissimo. Il suono non deve mai ripetersi né strutturarsi in un loop o in un beat. Rifiuta le scale armoniche tradizionali e la scansione del tempo in quarti: le frequenze devono oscillare in modo imprevedibile, aleatorio e impercettibilmente caotico. Mantieni il volume a livelli minimi, sfiorando il limite dell'udibile e lavorando su riverberi ampi e ovattati. La traccia non deve contenere progressioni armoniche o cadenze di risoluzione, lasciando il suono galleggiare nel silenzio senza una destinazione formale.",
    S_en: "Build the acoustic dimension around a single initial sound impulse that fades into a very long decay. The sound should never repeat or structure itself into a loop or beat. Reject traditional harmonic scales and time scanning in quarters: frequencies should oscillate unpredictably, randomly, and imperceptibly chaotically. Keep the volume at minimal levels, brushing the limit of audibility and working on wide and muffled reverbs. The track should not contain harmonic progressions or resolution cadences, leaving the sound to float in silence without a formal destination.",
    C_it: "Il movimento si attiva attraverso un piccolo impulso di partenza che scarica subito la sua spinta, lasciando che il corpo o l'oggetto continui a muoversi per pura inerzia. L'azione cinetica è un evento isolato e mai iterato. La traiettoria non deve seguire binari rigidi, assi dritti o griglie spaziali, ma snodarsi in modo irregolare, asimmetrico e leggermente erratico. Riduci la velocità e la forza impressa al minimo, creando una sensazione di galleggiamento o di deriva. Non impostare un punto d'arrivo o una decelerazione programmata verso un target, lasciando che la dinamica si esaurisca fino all'immobilità in un punto indeterminato.",
    C_en: "The movement is activated through a small initial impulse that immediately releases its thrust, allowing the body or object to continue moving purely by inertia. The kinetic action is an isolated event and never iterated. The trajectory should not follow rigid tracks, straight axes, or spatial grids but unfold in an irregular, asymmetric, and slightly erratic manner. Reduce speed and applied force to a minimum, creating a sensation of floating or drifting. Do not set a destination point or a programmed deceleration toward a target, allowing the dynamic to dissipate into stillness at an indeterminate point.",
    Sp_it: "L'architettura dello spazio accoglie l'utente con una soglia o un dettaglio d'ingresso che perde rapidamente rilievo man mano che ci si addentra. Lo spazio è concepito come un unico ambiente non replicato, privo di moduli, colonne in serie o elementi ripetitivi. Elimina la pianta euclidea o la griglia regolare, preferendo volumi fluidi, pareti curve e contorni sfumati che creano un senso di disorientamento controllato. Mantieni stimolazioni sensoriali ambientali molto basse, con illuminazione soffusa e materiali fonoassorbenti. Non inserire corridoi, segnaletiche o percorsi obbligati, permettendo al fruitore di stare o galleggiare al centro senza sentirsi incanalato verso un'uscita o una tappa specifica.",
    Sp_en: "The architecture of the space welcomes the user with a threshold or entry detail that quickly loses prominence as one moves inward. The space is conceived as a single, non-replicated environment, devoid of modules, serial columns, or repetitive elements. Eliminate the Euclidean plan or regular grid, favoring fluid volumes, curved walls, and blurred contours that create a sense of controlled disorientation. Keep environmental sensory stimulations very low, with soft lighting and sound-absorbing materials. Do not insert corridors, signage, or mandatory paths, allowing the user to stay or float in the center without feeling channeled toward an exit or specific stop.",
    T_it: "Le sollecitazioni corporee si manifestano con un singolo stimolo iniziale — come un leggero sapore neutro, un effluvio impalpabile o una variazione termica sottile — che svanisce rapidamente senza reiterarsi. Rifiuta la modularità, la cadenza o la ripetizione strutturata degli stimoli. La composizione sensoriale evita griglie e contrasti netti, proponendo note olfattive e gustative soffuse, mutevoli e impercettibilmente caotiche, a bassissima intensità percettiva. Temperature corporee neutre, texture organiche non ruvide e assenza di sapori o profumi persistenti devono accompagnare una percezione di galleggiamento, neutralità e assenza di peso.",
    T_en: "Bodily stimuli manifest with a single initial stimulus — such as a light neutral taste, an imperceptible effluvium, or a subtle thermal variation — that quickly fades without repetition. Reject modularity, cadence, or structured repetition of stimuli. The sensory composition avoids grids and sharp contrasts, offering olfactory and gustatory notes that are soft, mutable, and imperceptibly chaotic, at very low perceptual intensity. Neutral body temperatures, non-rough organic textures, and the absence of persistent tastes or scents should accompany a perception of floating, neutrality, and weightlessness.",

    V_it: "Un discorso dal ritmo costante e avvolgente che scorre senza pause, conducendo l'ascoltatore lungo una narrazione continua. La sintassi è fluida e priva di ostacoli o bruschi cambi di tono. Le parole si collegano l'una all'altra in un movimento armonico e progressivo. L'intensità rimane media e uniforme, senza picchi drammatici né arresti improvvisi. Ogni frase suggerisce naturalmente la successiva, mantenendo la mente immersa in un flusso verbale ininterrotto e privo di attriti.",

    e:0,r:1,d:0,i:1,p:0,n_it:"Turbolenza",n_en:"Turbulence",
    desc_it:"Uno stato di agitazione percettiva continua, ad alta intensità e priva di ordine o direzione.",
    desc_en:"A state of continuous perceptual agitation, high intensity, and lacking order or direction.",
    pos_it:"energia",pos_en:"energy",neg_it:"caos",neg_en:"chaos",
    V_it: "Un flusso di parole concitato, denso e ininterrotto che investe l'ascoltatore senza concedere pause o strutture logiche. La sintassi è frammentata e priva di punteggiatura regolare, caratterizzata da un tono di voce alto e vibrante. Il discorso accumula concetti, immagini ed esclamazioni in modo caotico ma continuo, creando una saturazione linguistica che travolge la mente. Rifiuta l'ordine grammaticale o la chiarezza espositiva, mantenendo una pressione verbale costante, rumorosa e priva di una meta narrativa.",
    V_en: "A concatenated, dense, uninterrupted word flow investing the listener without granting pauses or logical structures. Syntax is fragmented and devoid of regular punctuation, characterized by a high, vibrant voice tone. The discourse accumulates concepts, images, and exclamations chaotically yet continuously, creating linguistic saturation overwhelming the mind. It rejects grammatical order or expository clarity, maintaining constant, loud, narrative-goal-free verbal pressure.",
    Ic_it: "Una superficie visiva satura e dinamica, sovraffollata di forme frastagliate, sovrapposizioni e colori vividi ad alto contrasto. La composizione non offre punti di riposo o griglie di lettura, moltiplicando gli stimoli visivi in ogni direzione. Gli elementi si incastrano e si sovrappongono in un disordine continuo e caotico che mantiene lo sguardo in costante agitazione. Assenza di simmetria, spazi vuoti o percorsi visivi ordinati, per una percezione visiva densa, vibrante e priva di un centro focale.",
    Ic_en: "A saturated, dynamic visual surface overcrowded with jagged shapes, overlaps, and high-contrast vivid colors. Composition offers no resting points or reading grids, multiplying visual stimuli in all directions. Elements interlock and overlap in continuous chaotic disorder keeping gaze in constant agitation. Absence of symmetry, empty spaces, or orderly visual paths for dense, vibrant visual perception lacking a focal center.",
    S_it: "Un paesaggio acustico rumoroso, denso e ininterrotto, caratterizzato da frequenze sovrapposte ad altissimo volume. Il suono si manifesta come una massa sonica complessa e stratificata, in cui rumori bianchi, distorsioni e timbri aggressivi si fondono senza una griglia ritmica o armonica. Rifiuta il silenzio e la regolarità, mantenendo una saturazione acustica costante che riempie interamente lo spazio d'ascolto. L'esperienza sonora scuote continuamente l'udito senza mai risolversi o trovare un equilibrio.",
    S_en: "Noisy, dense, uninterrupted acoustic landscape characterized by overlapping frequencies at very high volume. Sound manifests as complex, stratified sonic mass where white noises, distortions, and aggressive timbres merge without rhythmic or harmonic grid. It rejects silence and regularity, maintaining constant acoustic saturation filling listening space entirely. Sound experience continuously shakes hearing without resolving or finding balance.",
    C_it: "Una dinamica corporea convulsa, disordinata e ad altissima energia che si prolunga nel tempo senza tregua. Il movimento è fatto di scatti imprevisti, vibrazioni intense e cambi di direzione continui che rifiutano traiettorie regolari o gesti controllati. L'energia applicata è elevata e costante, producendo una sollecitazione fisica intensa e stancante. L'azione non segue un piano o un bersaglio, ma si consuma in una presenza cinetica vorticosa, caotica e priva di stasi.",
    C_en: "Convulsive, disorderly, extremely high-energy bodily dynamics prolonging unremittingly over time. Movement consists of unforeseen snaps, intense vibrations, and continuous direction changes rejecting regular trajectories or controlled gestures. Applied energy is high and constant, producing intense, exhausting physical solicitation. Action follows no plan or target, consuming itself in vortex-like, chaotic, stasis-free kinetic presence.",
    Sp_it: "Un ambiente architettonico saturo, caratterizzato da volumi frastagliati, pareti oblique, luci strobo o brillanti e materiali dalla matericità aggressiva. Lo spazio non offre corridoi chiari o zone di sosta, ma avvolge l'utente in una massa di stimoli tridimensionali sovrapposti. La configurazione spaziale genera un senso di compressione e movimento continuo, dove non esiste una direzione privilegiata o un punto di orientamento, costringendo la presenza a uno stato di continua reazione.",
    Sp_en: "Saturated architectural environment characterized by jagged volumes, oblique walls, strobe or bright lights, and aggressive tactile materials. Space offers no clear corridors or resting zones, enveloping user in mass of overlapping three-dimensional stimuli. Spatial configuration generates compression sense and continuous movement where privileged direction or orientation point does not exist, forcing presence into continuous reaction state.",
    T_it: "Un'esperienza corporea intensa e tempestosa che sollecita contemporaneamente tutti i sensi in modo caotico e prolungato. Superfici ruvide o pungenti si alternano a variazioni termiche brusche e sbalzi di temperatura continui. Aromi penetranti e sapori fortemente acidi o speziati saturano l'olfatto e il palato senza un ordine preciso. Il corpo è immerso in una combinazione sensoriale densa, vibrante e priva di pause, che stimola la pelle e i sensi con un'intensità ininterrotta.",
    T_en: "Intense, stormy bodily experience simultaneously soliciting all senses chaotically and prolonged. Rough or stinging surfaces alternate with abrupt thermal variations and continuous temperature swings. Penetrating aromas and strongly acidic or spicy flavors saturate olfaction and palate without precise order. Body is immersed in dense, vibrant, pause-free sensory combination stimulating skin and senses with uninterrupted intensity.",
    ex_it: [
      "Jackson Pollock – Number 1A, 1948 (tracce di forma, colore e figure intense e ripetitive)",
      "Piatto Sichuan con pepe e peperoncino (Sapore piccante e intorpidente denso e continuo)",
      "Cattedrale della Sagrada Família (Decorazione visiva plastica satura e tridimensionale continua)",
      "Traccia Noise Wall of Sound (Muro di suono distorto continuo ad altissimo volume)",
      "BAPE – “ABC Camo Pattern” (Costante ripetizione di un pattern caotico ed intenso)"
    ],
    ex_en: [
      "Jackson Pollock – Number 1A, 1948 (traces of intense and repetitive forms, colors, and figures)",
      "Sichuan dish with pepper and chili (dense, continuous numbing spicy flavor)",
      "Sagrada Família Cathedral (saturated, continuous three-dimensional plastic visual decoration)",
      "Noise Wall of Sound track (continuous distorted sound wall at extreme volume)",
      "BAPE – 'ABC Camo Pattern' (constant repetition of chaotic, intense pattern)"
    ]

  {
    e:0,r:1,d:0,i:0,p:1,n_it:"Distensione",n_en:"Distension",
    desc_it:"Una cadenza bilanciata che dà respiro all'attenzione, alternando presenza e rilascio in un tempo regolare.",
    desc_en:"A balanced cadence that gives breath to attention, alternating presence and release in regular time.",
    pos_it:"respiro",pos_en:"breath",neg_it:"distacco",neg_en:"detachment",
    V_it: "Il testo si articola attraverso una metrica piana, regolare e traspirante, in cui frasi di uguale lunghezza si susseguono con un ritmo pacato. La sintassi è limpida, pulita e priva di concetti complessi o scatti emotivi. Il discorso alterna momenti di parola a pause di silenzio ben misurate, creando una cadenza rassicurante che non forza l'attenzione. L'intensità si mantiene bassa e costante, offrendo un messaggio chiaro e bilanciato che infonde calma e permette alla mente di respirare ad ogni virgola.",
    V_en: "The text articulates through flat, regular, breathable metrics where equal-length phrases succeed with calm rhythm. Syntax is limpid, clean, devoid of complex concepts or emotional jolts. Discourse alternates word moments with well-measured silence pauses, creating reassuring cadence not forcing attention. Intensity remains low and constant, offering clear, balanced message instilling calm and allowing mind to breathe at every comma.",
    Ic_it: "Una composizione basata su griglie modulari aperte, ampi spazi vuoti ed elementi disposti con intervalli regolari e simmetrici. I colori sono tenuemente desaturati e i contrasti estremamente morbidi, creando un equilibrio visivo riposante. La superficie visiva non presenta affollamenti né dettagli aggressivi, lasciando che l'occhio scorra tra moduli ordinati e campiture omogenee. Il ritmo visivo è cadenzato e costante, offrendo uno spazio visivo pulito e rigenerante privo di qualsiasi tensione.",
    Ic_en: "Composition based on open modular grids, wide empty spaces, and elements arranged with regular, symmetrical intervals. Colors are softly desaturated and contrasts extremely soft, creating restful visual balance. Visual surface presents no crowding or aggressive details, letting eye flow between orderly modules and homogeneous color fields. Visual rhythm is cadenced and constant, offering clean, regenerating visual space free of tension.",
    S_it: "Un paesaggio acustico cadenzato da timbri caldi e frequenze pulite che si ripetono con una spaziatura temporale ampia e regolare. La traccia si fonda su accordi consonanti ed essenziali, a volume contenuto, integrando pause di silenzio tra un evento sonoro e il successivo. Rifiuta ritmi frenetici, distorsioni o picchi dinamici improvvisi. Il suono fluisce con la regolarità di un respiro profondo, avvolgendo l'ascoltatore in un'armonia pulita e prevedibile che favorisce il rilassamento.",
    S_en: "Acoustic landscape cadenced by warm timbres and clean frequencies repeating with wide, regular temporal spacing. Track is based on consonant, essential chords at moderate volume, integrating silence pauses between sound events. It rejects frantic rhythms, distortions, or sudden dynamic peaks. Sound flows with deep breath regularity, enveloping listener in clean, predictable harmony favoring relaxation.",
    C_it: "Un gesto calmo, ampio e misurato che si ripete con una scansione temporale costante e priva di sforzo. Il movimento segue linee geometriche morbide e simmetriche, alternando momenti di estensione a fasi di rilascio muscolare. La velocità è contenuta e l'energia spesa è perfettamente bilanciata. L'azione cinetica evoca il movimento ritmico del dondolio o del respiro, mantenendo una presenza corporea rilassata, stabile e completamente priva di rigidità o frenesia.",
    C_en: "Calm, wide, measured gesture repeating with constant, effortless temporal scanning. Movement follows soft, geometric, symmetrical lines, alternating extension phases with muscular release. Speed is contained and energy spent perfectly balanced. Kinetic action evokes rocking or breathing rhythmic movement, maintaining relaxed, stable bodily presence completely free of rigidity or frenzy.",
    Sp_it: "Un ambiente caratterizzato da proporzioni generose, moduli architettonici essenziali e una disposizione simmetrica degli arredi. Le pareti chiare, l'illuminazione diffusa e la presenza di ampi spazi di passaggio trasmettono una sensazione di ordine e respiro. Non esistono elementi di disturbo o percorsi intricati, ma una successione di campate o ambienti regolari che invitano a una sosta serena. Lo spazio accoglie l'utente con una struttura pulita che distende la percezione.",
    Sp_en: "Environment characterized by generous proportions, essential architectural modules, and symmetrical furniture arrangement. Light walls, diffuse illumination, and wide passage spaces convey order and breath feeling. No disturbance elements or intricate paths exist, but succession of regular bays or rooms inviting serene pause. Space welcomes user with clean structure distending perception.",
    T_it: "Una sollecitazione sensoriale delicata e ritmica che accarezza i sensi con equilibrio e prevedibilità. Superfici lisce e tiepide si combinano con note olfattive pulite e sapori delicati a bassa intensità. Le variazioni tattili o termiche avvengono con una cadenza soffusa e regolare, alternando la percezione del contatto a momenti di rilascio. L'esperienza corporea restituisce un senso di perfetto benessere, pulizia e distensione fisica priva di strappi o contrasti.",
    T_en: "Delicate, rhythmic sensory solicitation caressing senses with balance and predictability. Smooth, warm surfaces combine with clean olfactory notes and low-intensity delicate flavors. Tactile or thermal variations occur with soft, regular cadence, alternating contact perception with release moments. Bodily experience yields sense of perfect well-being, cleanliness, and physical distension free of tears or contrasts.",
    ex_it: [
      "Piatto della cerimonia del tè matcha (Bevanda calda dalle note delicate e regolari)",
      "Padiglione di Barcellona di Mies van der Rohe (Spazi ampi ordinati e traspiranti)",
      "Rituale di pulizia facciale Shiatsu (Gesti manuali ordinati cadenzati e distensivi)",
      "Paul Rand, 1972 - IBM (Griglia modulare con linee regolari)",
      "Il mio vicino Totoro di Hayao Miyazaki (Assenza di conflitti, scene ripetitive e distese)"
    ],
    ex_en: [
      "Matcha tea ceremony dish (Warm beverage with delicate, regular notes)",
      "Barcelona Pavilion by Mies van der Rohe (Wide, orderly, breathable spaces)",
      "Shiatsu facial cleansing ritual (Ordered, cadenced, distensive manual gestures)",
      "Paul Rand, 1972 - IBM (Modular grid with regular lines)",
      "My Neighbor Totoro by Hayao Miyazaki (Absence of conflict, repetitive and distended scenes)"
    ]
  },
{
  e:0,r:0,d:1,i:1,p:0,n_it:"Impulso",n_en:"Impulse",
  desc_it:"Un forte orientamento verso una direzione",
  desc_en:"A strong orientation toward a direction.",
  pos_it:"slancio",pos_en:"momentum",neg_it:"impulsività",neg_en:"impulsivity",
  V_it: "Un discorso caratterizzato da un'inclinazione energetica travolgente che indirizza subito l'attenzione verso un fine chiaro e urgente. La sintassi è vibrante, priva di schemi rigidi o pause esitanti, e si sviluppa attraverso parole cariche di passione e forza propulsiva. L'intensità della voce è elevata e sostiene una narrazione tesa, capace di proiettare la mente del lettore in avanti senza concedere deviazioni o momenti di stasi concettuale.",
  V_en: "A discourse characterized by a overwhelming energetic inclination that immediately directs attention toward a clear and urgent end. The syntax is vibrant, free of rigid patterns or hesitant pauses, and develops through words charged with passion and propulsive force. The voice intensity is high and supports a tense narrative capable of projecting the reader's mind forward without allowing deviations or moments of conceptual stasis.",
  Ic_it: "La composizione è dominata da un vettore dinamico imponente, da campiture di colore ad altissima saturazione e da spigolature che tagliano lo spazio diagonale. Rifiuta la simmetria, l'ordine statico e la ripetizione modulare, puntando su una carica visiva potente che orienta lo sguardo con decisione incontenibile. I contrasti marcati e le forme affilate generano una spinta ottica immediata che catapulta la percezione verso l'angolo di destinazione.",
  Ic_en: "The composition is dominated by an imposing dynamic vector, highly saturated color fields, and angular cuts that slice the space diagonally. It rejects symmetry, static order, and modular repetition, focusing on a powerful visual charge that orients the gaze with uncontrollable decisiveness. The marked contrasts and sharp forms generate an immediate optical push that catapults perception toward the destination corner.",
  S_it: "Una struttura acustica espansiva ad alta energia che prende avvio con un crescendo impetuoso e privo di ostacoli. La traccia evita i loop statici o le strutture piatte, sviluppando una sonorità ricca di frequenze calde ed esplosive che spingono l'ascolto verso una traiettoria tesa. Il volume sostenuto e l'andamento incalzante creano una pressione sonora che trascina l'udito con forza travolgente verso il punto di massima intensità.",
  S_en: "An expansive, high-energy acoustic structure that begins with an impetuous, obstacle-free crescendo. The track avoids static loops or flat structures, developing a sonority rich in warm, explosive frequencies that push listening toward a tense trajectory. The sustained volume and urgent pace create sonic pressure that pulls hearing with overwhelming force toward the point of maximum intensity.",
  C_it: "Un gesto vigoroso e accelerato che scatta in avanti lungo una traiettoria lineare e priva di esitazioni. Il corpo scarica una grande quantità di energia in un'unica spinta propulsiva che proietta il movimento verso il bersaglio. Non ci sono pause, oscillazioni o movimenti ciclici, ma una dinamica diretta, potente e tesa che trasforma l'inerzia in una corsa decisa verso la meta prescelta.",
  C_en: "A vigorous, accelerated gesture that springs forward along a linear, hesitation-free trajectory. The body discharges a large amount of energy in a single propulsive push that projects movement toward the target. There are no pauses, oscillations, or cyclical movements, but a direct, powerful, tense dynamic that transforms inertia into a decisive run toward the chosen goal.",
  Sp_it: "Un ambiente caratterizzato da linee prospettiche convergenti ad inclinazione accentuata e da un'illuminazione direzionale ad alta intensità. Lo spazio non presenta ostacoli centrali o configurazioni aperte, ma si conforma come un imbuto o una rampa ad alta tensione che convoglia la camminata dell'utente verso un traguardo visibile. L'atmosfera è vibrante e spinge la presenza a muoversi rapidamente verso la fine del percorso.",
  Sp_en: "An environment characterized by converging perspective lines at an accentuated inclination and high-intensity directional lighting. The space contains no central obstacles or open configurations, but takes the form of a funnel or high-tension ramp that channels the user's walk toward a visible goal. The atmosphere is vibrant and pushes presence to move rapidly toward the end of the path.",
  T_it: "Un'esperienza corporea marcata da una repentina vampata di calore diffuso, un'intensità tattile d'impatto e note olfattive o gustative penetranti e speziate. Gli stimoli sensoriali si concentrano lungo una direzione precisa, avvolgendo il corpo e il palato con una sensazione di carica fisica immediata. L'assenza di neutralità e la presenza di contorni netti stimolano la reazione organica guidandola con decisione verso un punto di attrazione.",
  T_en: "A bodily experience marked by a sudden burst of diffuse heat, impactful tactile intensity, and penetrating, spicy olfactory or gustatory notes. Sensory stimuli concentrate along a precise direction, enveloping the body and palate with a sensation of immediate physical charge. The absence of neutrality and the presence of sharp contours stimulate the organic reaction, guiding it decisively toward an attraction point.",
  ex_it: [

  ],

{
  e:0,r:0,d:1,i:0,p:1,n_it:"Focalizzazione",n_en:"Focus",
  desc_it:"La percezione di un binario logico chiaro che convoglia il pensiero verso un punto preciso senza distrazioni.",
  desc_en:"The perception of a clear logical track that channels thought toward a precise point without distractions.",
  pos_it:"chiarezza",pos_en:"clarity",neg_it:"rigidità",neg_en:"rigidity",
  V_it: "Il discorso si sviluppa lungo un'infrastruttura sintattica impeccabile, lineare e trasparente, dove ogni concetto è concatenato al successivo con estrema precisione logica. La narrazione procede priva di orpelli, divagazioni o picchi emotivi, mantenendo un registro calmo, controllato e rigoroso. Ogni parola ha un peso calcolato e contribuisce a convogliare l'attenzione del lettore verso un'unica conclusione inequivocabile e priva di distrazioni.",
  V_en: "The speech develops along an impeccable, linear, and transparent syntactic infrastructure, where each concept is concatenated to the next with extreme logical precision. The narrative proceeds without ornaments, digressions, or emotional peaks, maintaining a calm, controlled, and rigorous register. Every word has a calculated weight and contributes to channeling the reader's attention toward a single unequivocal conclusion free of distractions.",
  Ic_it: "Una composizione visiva fondata su una griglia prospettica severa, simmetrie calcolate e linee di fuga che convergono con esattezza matematica verso un unico centro focale. Toni neutri, contrasti bilanciati e assenza di elementi superflui garantiscono la massima pulizia del campo visivo. L'occhio viene incanalato lungo assi geometrici trasparenti, scorrendo senza esitazioni verso il punto centrale della superficie.",
  Ic_en: "A visual composition based on a severe perspective grid, calculated symmetries, and vanishing lines converging with mathematical precision toward a single focal center. Neutral tones, balanced contrasts, and the absence of superfluous elements ensure maximum clarity of the visual field. The eye is channeled along transparent geometric axes, sliding without hesitation toward the central point of the surface.",
  S_it: "Un paesaggio acustico essenziale e trasparente, in cui frequenze ben definite e armonie pulite si muovono lungo una traiettoria timbrica lineare. La traccia non fa uso di percussioni caotiche o saturazioni, ma sostiene l'ascolto con un andamento continuo e misurato che convoglia l'attenzione verso una nota guida. Il volume è bilanciato e l'architettura sonora rimane esente da deviazioni o rumori di fondo.",
  S_en: "An essential and transparent acoustic landscape, in which well-defined frequencies and clean harmonies move along a linear timbral trajectory. The track does not use chaotic percussion or saturation, but supports listening with a continuous, measured flow that channels attention toward a guiding note. The volume is balanced and the sonic architecture remains free of deviations or background noise.",
  C_it: "Un movimento fluido e controllato che scivola con precisione millimetrica lungo una corsia o una guida invisibile. Il gesto rifiuta le oscillazioni laterali, gli scatti o le variazioni di velocità, mantenendo un allineamento perfetto rispetto all'asse di avanzamento. La dinamica corporea esprime un'efficienza pura, dove ogni frazione di energia è canalizzata verso il raggiungimento del punto d'arresto finale.",
  C_en: "A fluid and controlled movement that glides with millimetric precision along a lane or an invisible guide. The gesture rejects lateral oscillations, sudden jerks, or speed changes, maintaining perfect alignment with the axis of advance. The bodily dynamic expresses pure efficiency, where every fraction of energy is channeled toward reaching the final stopping point.",
  Sp_it: "Un corridoio o una galleria ad architettura essenziale, definita da moduli regolari, pareti parallele e un'illuminazione incassata che traccia una linea continua sul pavimento. Lo spazio cancella le distrazioni laterali e orienta lo sguardo e il cammino dell'utente verso un unico fondale o elemento espositivo. La disposizione prossemica infonde una sensazione di chiarezza strutturale e guida la presenza in modo diretto.",
  Sp_en: "A corridor or gallery with essential architecture, defined by regular modules, parallel walls, and recessed lighting that traces a continuous line on the floor. The space removes lateral distractions and orients the gaze and the user's path toward a single backdrop or display element. The proxemic arrangement instills a sense of structural clarity and guides presence directly.",
  T_it: "Un profilo sensoriale pulito, caratterizzato da superfici lisce, temperature neutre e costanti, abbinate a un aroma sottile e a un sapore nitido che scivolano in modo ordinato sul palato. La percezione corporea è priva di attriti o rugosità, offrendo una sensazione di nitidezza tattile e olfattiva che incanala la sensibilità verso un unico punto di contatto bilanciato.",
  T_en: "A clean sensory profile, characterized by smooth surfaces, neutral and constant temperatures, paired with a subtle aroma and a crisp flavor that slide in an orderly way on the palate. Bodily perception is free of friction or roughness, offering a sensation of tactile and olfactory sharpness that channels sensitivity toward a single balanced point of contact.",

{
  e:0,r:0,d:0,i:1,p:1,n_it:"Compressione",n_en:"Compression",
  desc_it:"Uno stato di alta densità sensoriale ed energetica trattenuto all'interno di una struttura rigida.",
  desc_en:"A state of high sensory and energetic density held within a rigid structure.",
  pos_it:"concentrazione",pos_en:"concentration",neg_it:"oppressione",neg_en:"oppression",
  V_it: "Un testo ad altissima densità concettuale ed emotiva, stipato ed espresso all'interno di una gabbia sintattica o metrica estremamente severa e rigorosa. Il discorso accumula significati complessi, parole dense e toni intensi, senza tuttavia infrangere la struttura logica che lo racchiude. L'espressione verbale trattiene una pressione interna notevole, apparendo concisa, densa e carica di una forza espressiva pronta a sprigionarsi.",
  V_en: "A text of extremely high conceptual and emotional density, packed and expressed within an extremely severe and rigorous syntactic or metric cage. The discourse accumulates complex meanings, dense words, and intense tones without breaking the logical structure that encloses it. Verbal expression retains significant internal pressure, appearing concise, dense, and charged with an expressive force ready to burst forth.",
  Ic_it: "Una superficie visiva satura di materia, con colori profondi e scuri, tessiture fitte e contrasti elevati, racchiusa entro i confini di una cornice geometrica netta e indeformabile. La composizione trattiene l'impatto visivo all'interno di perimetri rigidi e griglie ortogonali, creando una sensazione di massa cromatica concentrata. L'immagine esprime una potenziale energia visiva strettamente incapsulata.",
  Ic_en: "A visually saturated surface, with deep and dark colors, dense textures, and high contrasts, enclosed within the bounds of a sharp, undeformable geometric frame. The composition holds the visual impact inside rigid perimeters and orthogonal grids, creating a sensation of concentrated chromatic mass. The image expresses a potentially visual energy tightly encapsulated.",
  S_it: "Un muro di suono denso e compatto, ricco di frequenze basse e sovrapposizioni timbriche ad alto volume, costretto all'interno di una griglia metrica impeccabile e rigida. La traccia non permette sbavature o dispersioni acustiche, contenendo l'enorme massa sonora entro binari ritmici precisi. L'ascolto percepisce una vibrazione potente",
  S_en: "A dense, compact wall of sound, rich in low frequencies and timbral overlaps at high volume, forced within an impeccable and rigid metric grid. The track leaves no acoustic smudges or dispersions, containing the enormous sonic mass within precise rhythmic lanes. Listening perceives a powerful vibration.",
  C_it: "Una contrazione muscolare o una spinta ad alta energia trattenuta in uno spazio corporeo ridotto e bloccato. Il movimento esprime una tensione enorme ma controllata, dove la forza accumulata non si dissipa all'esterno ma rimane confinata all'interno di una postura rigida e impeccabile. La dinamica cinetica è un condensato di potenza contenuta che mantiene la presenza fisica in uno stato di carica immobile.",
  C_en: "A muscular contraction or a high-energy push retained in a reduced, blocked bodily space. Movement expresses enormous but controlled tension, where accumulated force does not dissipate outward but remains confined within a rigid and impeccable posture. Kinetic dynamics are a condensed form of contained power that keeps the physical presence in a state of immobile charge.",
  Sp_it: "Un ambiente ristretto e dai volumi squadrati, caratterizzato da pareti spesse, materiali densi e un'illuminazione radente ad alta intensità. Lo spazio racchiude un'elevata densità di elementi o stimoli entro perimetri geometrici definiti e privi di vie di fuga visive. L'utente percepisce una pressione spaziale avvolgente, trovandosi immerso in un contenitore solido e saturo di presenza.",
  Sp_en: "A narrow environment with squared volumes, characterized by thick walls, dense materials, and low, high-intensity lighting. The space encloses a high density of elements or stimuli within defined geometric perimeters and without visual escape routes. The user perceives an enveloping spatial pressure, finding themselves immersed in a solid container saturated with presence.",
  T_it: "Una sollecitazione corporea intensa e concentrata: un sapore estremamente denso e amaro, un profumo penetrante e una forte pressione tattile o termica localizzata in un punto preciso. Gli stimoli sensoriali agiscono contemporaneamente con grande forza, ma rimangono circoscritti entro confini definiti, offrendo al corpo una sensazione di calore e densità fortemente trattenuta.",
  T_en: "An intense and concentrated bodily stimulation: an extremely dense and bitter taste, a penetrating perfume, and a strong tactile or thermal pressure localized in a precise point. Sensory stimuli act simultaneously with great force, but remain circumscribed within defined boundaries, offering the body a sensation of heat and strongly retained density.",

{
  e:1,r:1,d:1,i:0,p:0,n_it:"Attrazione",n_en:"Attraction",
  desc_it:"Un'attrazione cadenzata che ti tira lentamente verso un punto.",

  pos_it:"desiderio",pos_en:"desire",neg_it:"manipolazione",neg_en:"manipulation",
  V_it: "Il discorso si sviluppa attraverso una ripetizione ritmica e cadenzata di concetti o strutture grammaticali che agisce come un richiamo costante. Senza fare uso di forme rigide, il flusso verbale reitera formule suggestive che accumulano un'attrazione progressiva, conducendo la mente del lettore passo dopo passo verso la frase conclusiva. L'intensità e il ritmo modulato creano una fascinazione continua che trascina la comprensione verso la meta.", 
  V_en: "The speech develops through the rhythmic and cadenced repetition of concepts or grammatical structures that acts as a constant call. Without using rigid forms, the verbal flow reiterates suggestive formulas that accumulate progressive attraction, leading the reader's mind step by step toward the concluding sentence. The intensity and modulated rhythm create continuous fascination that drags understanding toward the goal.",
  Ic_it: "Una sequenza visiva modulata e cadenzata, dove motivi o elementi grafici si ripetono ad intervalli regolari lungo una traiettoria che converge verso il centro del campo visivo. L'immagine sfuma i contrasti e ammorbidisce le forme, utilizzando il ritmo visivo come una spinta costante che cattura l'occhio e lo trascina con dolcezza lungo la superficie fino al punto focale desiderato.", 
  Ic_en: "A modulated and cadenced visual sequence, where motifs or graphic elements repeat at regular intervals along a trajectory that converges toward the center of the visual field. The image softens contrasts and smooths forms, using visual rhythm as a constant push that captures the eye and gently drags it along the surface until the desired focal point.",
  S_it: "Una pulsazione acustica regolare ed avvolgente che procede con una cadenza costante, arricchendosi di sfumature timbriche ad ogni ciclo. La traccia sfrutta un andamento ipnotico ma direzionato, dove ogni battito trascina l'ascolto un passo più vicino a una frequenza di risoluzione finale. Il volume morbido e la scansione del tempo costante esercitano una trazione sonica ininterrotta e magnetica.", 
  S_en: "A regular and enveloping acoustic pulse that proceeds with a steady cadence, enriching itself with timbral nuances at each cycle. The track exploits a hypnotic yet directed flow, where each beat draws the listener one step closer to a final resolution frequency. The soft volume and constant time scan exert an uninterrupted, magnetic sonic traction.",
  C_it: "Un movimento ritmico e cadenzato che avanza con passo regolare lungo una traiettoria curva e attrattiva. Il gesto unisce la ripetizione di un'oscillazione costante a un'inclinazione progressiva verso la meta, creando una dinamica d'avanzamento senza attriti. Il corpo si lascia trasportare da questa sequenza di impulsi leggeri, scivolando inesorabilmente verso la posizione d'arrivo.", 
  C_en: "A rhythmic and cadenced movement that advances with a regular step along a curved and attractive trajectory. The gesture combines the repetition of a constant oscillation with a progressive inclination toward the goal, creating a frictionless advance dynamic. The body allows itself to be carried by this sequence of light impulses, sliding inexorably toward the arrival position.",
  Sp_it: "Un cammino monumentale o un porticato caratterizzato da campate e pilastri che si succedono con intervalli regolari, guidando i passi dell'utente verso un fondale prospettico. L'architettura sfrutta la cadenza degli elementi strutturali per esercitare un'attrazione spaziale continua, invitando la persona ad avanzare con ritmo costante all'interno del percorso senza deviare.", 
  Sp_en: "A monumental path or portico characterized by bays and pillars that succeed each other at regular intervals, guiding the user's steps toward a perspectival backdrop. The architecture uses the cadence of structural elements to exert continuous spatial attraction, inviting the person to advance with constant rhythm within the path without deviating.",
  T_it: "Una stimolazione corporea cadenzata che alterna lievi contatti tattili, sbuffi aromatici e variazioni termiche calde a intervalli regolari. Gli stimoli si ripetono con una sequenza costante mentre si intensificano delicatamente, attirando il palato, l'olfatto e la pelle verso un'esperienza di contatto profondo e progressivo che guida la percezione in avanti.", 
  T_en: "A cadenced bodily stimulation alternating light tactile contacts, aromatic puffs, and warm thermal variations at regular intervals. The stimuli repeat with a constant sequence while gently intensifying, attracting the palate, smell, and skin toward a deep, progressive contact experience that guides perception forward.",

{
  e:1,r:1,d:0,i:1,p:0,n_it:"Vertigine",n_en:"Vertigo",
  desc_it:"Un disorientamento percettivo generato dall'impatto ritmico e intenso di stimoli privi di direzione e struttura.",
  desc_en:"A perceptual disorientation generated by the rhythmic and intense impact of stimuli lacking direction and structure.",
  pos_it:"intensità",pos_en:"intensity",neg_it:"disorientamento",neg_en:"disorientation",
  V_it: "Un flusso di parole incalzante e ad alta intensità che martella l'ascoltatore con una sequenza ritmata e ripetitiva di slogan, fonemi o concetti privi di un nesso logico o di uno sviluppo narrativo. La sintassi è frastagliata e priva di una griglia grammaticale ordinata, creando un accumulo verbale caotico e potente. Il discorso non porta ad alcuna conclusione o sintesi finale, ma sommerge la mente con un susseguirsi continuo di colpi verbali che provocano uno stordimento comunicativo e una perdita di riferimenti.", 
  V_en: "A rushing flow of words of high intensity that batters the listener with a rhythmic and repetitive sequence of slogans, phonemes, or concepts lacking logical connection or narrative development. The syntax is jagged and lacking an ordered grammatical grid, creating a powerful and chaotic verbal accumulation. The discourse leads to no conclusion or final synthesis, but overwhelms the mind with a continuous succession of verbal blows that cause communicative daze and a loss of reference.",
  Ic_it: "Una composizione visiva ad altissimo contrasto e saturazione, dominata da pattern intermittenti, luci stroboscopiche o motivi visivi che sfarfallano a ritmo regolare. L'immagine rifiuta qualsiasi griglia prospettica, simmetria o punto di fuga direzionato, moltiplicando i punti di impatto visivo lungo tutta la superficie. Assenza di un centro focale o di una meta di lettura, per una configurazione visiva pulsante, aggressiva e dinamica che stanca la vista ed elimina la percezione di un equilibrio spaziale.", 
  Ic_en: "A visual composition of extremely high contrast and saturation, dominated by intermittent patterns, strobe lights, or visual motifs that flicker at a regular rhythm. The image rejects any perspective grid, symmetry, or directed vanishing point, multiplying points of visual impact across the whole surface. Absence of a focal center or reading goal, creating a pulsating, aggressive, dynamic visual configuration that tires the eyes and eliminates the perception of spatial balance.",
  S_it: "Un paesaggio acustico dominato da percussioni martellanti, beat pesanti e frequenze stridenti ad alto volume che si ripetono in un loop ipnotico ed ossessivo. La traccia si sviluppa senza una progressione armonica o una risoluzione melodica, rifiutando le griglie musicali tradizionali per immergere l'ascoltatore in un impatto sonico continuo. Il suono aggredisce l'udito con colpi ritmici incessanti e privi di una meta formale, generando uno stordimento uditivo ed un senso di smarrimento sensoriale.", 
  S_en: "An acoustic landscape dominated by hammering percussion, heavy beats, and screaming high-volume frequencies that repeat in a hypnotic and obsessive loop. The track develops without harmonic progression or melodic resolution, rejecting traditional musical grids to immerse the listener in continuous sonic impact. The sound attacks the ear with incessant rhythmic blows lacking formal direction, generating auditory dazes and a sense of sensory disorientation.",
  C_it: "Un movimento rapido, convulsivo e ritmico che scuote il corpo con accelerazioni ed arresti continui ad alta energia. La dinamica non segue una traiettoria lineare né si dirige verso un traguardo spaziale, ma si consuma in una sequenza di scatti, rotazioni o pulsazioni fisiche imprevedibili. Il gesto consuma molta forza e rifiuta la fluidità o l'allineamento posturale, inducendo una percezione corporea di sbandamento, perdita di equilibrio e sollecitazione fisica travolgente.", 
  C_en: "A fast, convulsive, rhythmic movement that shakes the body with continuous accelerations and stops of high energy. The dynamic does not follow a linear trajectory or head toward a spatial goal, but is spent in a sequence of unpredictable jerks, rotations, or physical pulsations. The gesture consumes much force and rejects fluidity or postural alignment, inducing a bodily perception of swaying, loss of balance, and overwhelming physical stimulation.",
  Sp_it: "Un ambiente architettonico saturo, caratterizzato da luci ad intermittenza ritmica, rifrazioni specchiate e volumi irregolari privi di simmetria o griglie ortogonali. Lo spazio non offre corridoi direzionati, uscite visibili o punti di riposo, ma avvolge la persona in una massa di stimoli tridimensionali che pulsano ad alta intensità. La conformazione spaziale abolisce i punti di riferimento orizzontali e verticali, generando un senso di galleggiamento caotico e disorientamento prospettico.", 
  Sp_en: "A saturated architectural environment, characterized by rhythmically intermittent lights, mirrored refractions, and irregular volumes without symmetry or orthogonal grids. The space offers no directed corridors, visible exits, or rest points, but envelops the person in a mass of three-dimensional stimuli pulsing at high intensity. The spatial configuration abolishes horizontal and vertical reference points, generating a sense of chaotic floating and perspectival disorientation.",
  T_it: "Una sollecitazione corporea intensa e pulsante che investe contemporaneamente il tatto, l'olfatto, il gusto e la propriocezione. Vibrazioni meccaniche a ritmo costante si combinano con sbalzi termici repentini, odori pungenti ad intermittenza e sapori elettrici o metallici ad alta saturazione. L'esperienza sensoriale priva il corpo di punti di ancoraggio stabili, producendo una sensazione di stordimento organico, accelerazione del battito e oscillazione percettiva profonda.", 
  T_en: "An intense, pulsating bodily stimulation that simultaneously affects touch, smell, taste, and proprioception. Mechanical vibrations at a constant rhythm combine with sudden thermal swings, intermittent pungent odors, and high-saturation electric or metallic flavors. The sensory experience strips the body of stable anchoring points, producing a sensation of organic daze, accelerated heartbeat, and deep perceptual oscillation.",

  e:1,r:1,d:0,i:0,p:1,n_it:"Familiarità",n_en:"Familiarity",
  desc_it:"La sensazione di stabilità e certezza interiore generata dal ritorno regolare di elementi già noti all'interno della struttura.",
  desc_en:"The sensation of stability and inner certainty generated by the regular return of known elements within the structure.",
  pos_it:"conforto",pos_en:"comfort",neg_it:"abitudine",neg_en:"habit",
  V_it: "Un testo che si sviluppa attorno alla riproposizione di schemi grammaticali noti e ritornelli rassicuranti. Il discorso non presenta crescendo narrativi o spinte direzionali, ma scorre su una griglia sintattica piana e prevedibile a bassa intensità. Questa regolarità di fondo priva di tensione sfocia tuttavia sul finale in un accento verbale netto, un'affermazione conclusiva ad alta incisività o una parola chiave che piazza un punto di enfasi inequivocabile e fissa il senso del messaggio.", 
  V_en: "A text that develops around the re-presentation of familiar grammatical schemas and reassuring refrains. The discourse shows no narrative crescendos or directional pushes, but flows over a flat, predictable syntactic grid at low intensity. This background regularity, free of tension, nevertheless culminates at the end in a clear verbal accent, a conclusive statement of high incisiveness, or a key word that sets an unequivocal emphasis and fixes the sense of the message.",
  Ic_it: "Una composizione visiva fondata su un motivo modulare e regolare che si ripete in modo pacifico sulla superficie. L'immagine non utilizza linee di fuga o vettori di movimento, mantenendo un equilibrio formale privo di accelerazioni. Sul punto di chiusura del campo visivo, la struttura colloca un dettaglio cromatico saturo, un marchio grafico nitido o un elemento di enfasi visiva che attira lo sguardo su un accento finale solido ed evidente.", 
  Ic_en: "A visual composition based on a modular, regular motif that repeats peacefully across the surface. The image does not use vanishing lines or movement vectors, maintaining a formal balance free of acceleration. At the closing point of the visual field, the structure places a saturated chromatic detail, a sharp graphic mark, or a visual emphasis element that draws the eye toward a final solid and evident accent.",
  S_it: "Un'architettura acustica basata su loop armonici caldi e motivi consolitatori che ritornano a cadenza costante. La traccia evita crescendo dinamici o progressioni verso una meta, mantenendo un volume contenuto e rassicurante. La successione di accordi prevedibili si risolve nell'ultima battuta con un colpo staccato ad alta definizione o un accento timbrico finale che marca la chiusura con una chiara e distinta enfasi sonora.", 
  S_en: "An acoustic architecture based on warm harmonic loops and consoling motifs that return at a steady cadence. The track avoids dynamic crescendos or progressions toward a goal, maintaining a contained and reassuring volume. The succession of predictable chords resolves in the final bar with a sharply defined detached stroke or a final timbral accent that marks the closure with a clear and distinct sonic emphasis.",
  C_it: "Un gesto cadenzato e regolare che si ripete secondo uno schema motorio fluido e ben memorizzato. La dinamica si adagia su un ritmo tranquillo, privo di spinte propulsive o traiettorie tese verso l'esterno. Il movimento conclude la propria traiettoria con uno scatto d'arresto coordinato o un'impronta di pressione finale marcata, trasformando la ripetizione ritmica in un accento fisico netto e steso con precisione.", 
  C_en: "A cadenced, regular gesture that repeats according to a fluid and well-memorized motor schema. The dynamics rest on a tranquil rhythm, free of propulsive pushes or tense trajectories outward. The movement concludes its trajectory with a coordinated stopping snap or a marked final pressure imprint, transforming rhythmic repetition into a clear, precisely placed physical accent.",
  Sp_it: "Uno spazio architettonico cadenzato dalla ripetizione regolare di elementi strutturali e materiali tradizionali. L'ambiente offre un percorrere rilassato e privo di imbuti prospettici, consentendo alla presenza di muoversi in un contesto prevedibile. Il percorso culmina al termine della stanza davanti a un portale ad alto contrasto o a una stele d'accento che colloca un punto di enfasi spaziale chiaro nel contesto ordinato.", 
  Sp_en: "An architectural space cadenced by the regular repetition of structural elements and traditional materials. The environment offers a relaxed passage free of perspectival funnels, allowing presence to move within a predictable context. The path culminates at the end of the room before a high-contrast portal or an accent stele that places a clear spatial emphasis point within the orderly context.",
  T_it: "Un'esperienza corporea che offre una sollecitazione tattile, olfattiva e gustativa costante, fatta di superfici morbide, note di sapore panee e aromi delicati che si ripresentano in modo regolare. La percezione si mantiene stabile e priva di sbalzi, per poi chiudersi sul finale con un netto contrasto termico o una pressione puntuale sulla pelle che marca un accento sensoriale distinto e ben percepibile.", 
  T_en: "A bodily experience that offers a constant tactile, olfactory, and gustatory stimulation, made of soft surfaces, familiar flavor notes, and delicate aromas that recur regularly. Perception remains stable and free of jolts, then closes at the end with a sharp thermal contrast or a pointed pressure on the skin that marks a distinct and clearly perceptible sensory accent.",

{
  e:1,r:0,d:1,i:1,p:0,n_it:"Slancio",n_en:"Dash",
  desc_it:"Forte spinta in avanti verso una meta, vissuta con dinamismo e convinzione.",
  desc_en:"Strong forward push toward a goal, experienced with dynamism and conviction.",
  pos_it:"dinamismo",pos_en:"dynamism",neg_it:"precipitazione",neg_en:"hastiness",
  V_it: "Un discorso appassionato ed incisivo che si apre con una dichiarazione d'impatto per poi proiettarsi con forza travolgente verso un traguardo futuro. La sintassi è dinamica, ricca di verbi d'azione e priva di strutture rigide o ripetizioni ritornellate. Il tono di voce è alto, sicuro e vibrante, capace di comunicare urgenza ed entusiasmo. Ogni frase accumula energia concettuale e spinge il lettore in avanti con convinzione e chiarezza d'intenti.", 
  V_en: "A passionate and incisive discourse that opens with a striking declaration before projecting itself with overwhelming force toward a future goal. The syntax is dynamic, rich in action verbs, and free of rigid structures or repeated refrains. The voice tone is high, sure, and vibrant, capable of communicating urgency and enthusiasm. Every sentence accumulates conceptual energy and pushes the reader forward with conviction and clarity of intent.",
  Ic_it: "Una composizione dominata da linee diagonali spezzate, vettori prospettici e forti contrasti cromatici che scattano verso l'angolo superiore dello schermo. L'immagine rifiuta le griglie ortogonali e le simmetrie statiche, concentrando tutta la carica visiva in un'unica forma aerodinamica e spigolosa. L'impatto visivo è immediato e potente, orientando lo sguardo con decisione verso un punto di arrivo dinamico e carico di energia.", 
  Ic_en: "A composition dominated by broken diagonal lines, perspective vectors, and strong chromatic contrasts that leap toward the upper corner of the screen. The image rejects orthogonal grids and static symmetries, concentrating all visual charge into a single aerodynamic, angular form. The visual impact is immediate and powerful, orienting the gaze decisively toward a dynamic arrival point charged with energy.",
  S_it: "Un'architettura sonora ad alta intensità che scatta con un attacco secco per poi lanciarsi in un crescendo travolgente verso una nota di risoluzione finale. La traccia evita loop o cadenze ritmiche fisse, sviluppando un'unica traiettoria acustica tesa ed esplosiva. Frequenze brillanti, ottoni o sint carichi di volume spingono l'ascolto con forza inarrestabile, creando una sensazione di volo, velocità e proiezione verso la meta.", 
  S_en: "A high-intensity sound architecture that starts with a sharp attack and then launches into an overwhelming crescendo toward a final resolution note. The track avoids loops or fixed rhythmic cadences, developing a single tense, explosive acoustic trajectory. Bright frequencies, brass, or high-volume synths push listening with unstoppable force, creating a sense of flight, speed, and projection toward the goal.",
  C_it: "Un movimento muscolare potente, fluido e direzionato che scatta con massima accelerazione verso un bersaglio preciso. Il gesto sfrutta tutta l'energia corporea disponibile senza perdersi in oscillazioni o ripetizioni, tracciando una linea d'avanzamento tesa e dinamica. La percezione cinetica è quella di un salto, di uno scatto d'atleta o di una spinta propulsiva che proietta il corpo nello spazio con sicurezza assoluta.", 
  C_en: "A powerful, fluid, and directed muscular movement that springs with maximum acceleration toward a precise target. The gesture uses all available bodily energy without getting lost in oscillations or repetitions, tracing a tense, dynamic line of advance. The kinetic perception is that of a jump, an athlete's burst, or a propulsive push that projects the body through space with absolute confidence.",
  Sp_it: "Un ambiente caratterizzato da pareti convergenti, rampe ad alta inclinazione e un'illuminazione direzionale ad altissima intensità. Lo spazio cancella gli elementi di stasi e le geometrie modulari rigide, conformandosi come una pista di lancio o un canale prospettico che spinge fisicamente l'utente verso il fondo. La conformazione prossemica infonde carica energetica e dinamismo, invogliando a percorrere lo spazio a passo spedito.", 
  Sp_en: "An environment characterized by converging walls, steep ramps, and directional lighting of extremely high intensity. The space removes elements of stasis and rigid modular geometries, conforming like a launch track or a perspectival channel that physically pushes the user toward the end. The proxemic configuration infuses energetic charge and dynamism, inviting the user to traverse the space at a brisk pace.",
  T_it: "Una sollecitazione corporea intensa ed energizzante: una sferzata di aria fresca, un aroma agrumato o speziato penetrante e un sapore acido o piccante che accende subito il palato. Le superfici presentano texture scattanti ed incisive, mentre la stimolazione termica e tattile investe il corpo con una spinta propulsiva chiara che attiva i riflessi, aumenta il tono muscolare e guida i sensi verso la meta.", 
  T_en: "An intense and energizing bodily stimulation: a burst of fresh air, a penetrating citrus or spicy aroma, and an acidic or spicy flavor that immediately ignites the palate. The surfaces have sharp, incisive textures, while thermal and tactile stimulation invests the body with a clear propulsive push that activates reflexes, increases muscle tone, and guides the senses toward the goal.",

  C_it: "Un movimento cadenzato con forti accenti finali, regolare e prolungato che si sviluppa lungo un asse rettilineo ben definito. Il gesto procede con passo costante ed efficiente all'interno di una traiettoria guidata, mantenendo il corpo in perfetto allineamento. La dinamica motoria esprime la sensazione di un cammino consapevole e privo di sforzo eccessivo, dove ogni passo misura una porzione di spazio verso la meta prefissata e ambita. ",

  Sp_it: "Un ambiente dai volumi squadrati e dalle pareti spesse, definito da un'illuminazione ferma e da una disposizione rigida degli arredi che non suggerisce corridoi o percorsi prospettici. Lo spazio racchiude l'utente in un contenitore geometrico privo di distrazioni, accompagnando la presenza fino al termine della stanza, dove la struttura posiziona una pedana o un pilastro d'arresto che colloca un accento spaziale definitivo.",
